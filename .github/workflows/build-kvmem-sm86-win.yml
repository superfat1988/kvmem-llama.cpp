# Build kvmem-llama.cpp (KVMem + llama.cpp) for sm_86 (RTX 30 series) on Windows
# KVMem requires exactly CUDA 13.2 Update 2 (nvcc 13.2.86) for IQ3/IQ4 correctness
# (nvcc 13.2.51 is known to produce garbage output on Qwen3.8-27B IQ3_S).
# Produces llama-kvmem-server / llama-kvmem-cli / llama-quantize / llama-cli / llama-bench
# plus bundled CUDA 13.2 runtime DLLs, uploaded as a downloadable artifact.
name: build-kvmem-sm86-win

on:
  workflow_dispatch:

jobs:
  build-windows-sm86:
    runs-on: windows-2022
    steps:
      - name: Checkout (with llama.cpp submodule pin)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup CUDA 13.2 Update 2 (nvcc 13.2.86)
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '13.2.2'
          method: 'network'

      - name: Verify nvcc exact version (13.2.86 required)
        shell: bash
        run: |
          nvcc --version
          nvcc --version | grep -q "V13.2.86" || { echo "nvcc is not 13.2.86; KVMem correctness requires exactly this compiler"; exit 1; }

      - name: Setup MSVC environment (Ninja)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Replay KVMem patches on pinned llama.cpp
        shell: bash
        run: |
          bash scripts/apply-patches.sh
          echo "--- llama.cpp patch status ---"
          git -C llama.cpp status --short || true

      - name: Configure (sm_86, Release, FA all quants)
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_CUDA=ON \
            -DGGML_CUDA_FA_ALL_QUANTS=ON \
            -DCMAKE_CUDA_ARCHITECTURES=86 \
            -DKVMEM_BUILD_LLAMA=ON \
            -DLLAMA_KVMEM=ON \
            -DLLAMA_KVMEM_ROOT="$GITHUB_WORKSPACE"

      # Build ONLY the deliverable targets. The kvmem test targets
      # (tests/nvme_kv_tier_test.cpp etc.) include POSIX-only headers
      # (<unistd.h>, <sys/*.h>) and cannot compile under MSVC, which broke the
      # earlier "build everything" step. LLAMA_BUILD_EXAMPLES is forced OFF
      # upstream, so llama-cli / llama-bench targets do not exist.
      - name: Build binaries (deliverable targets only)
        shell: bash
        run: |
          cmake --build build --config Release -j 3 \
            --target llama-kvmem-server llama-kvmem-cli llama-quantize

      - name: Stage artifacts + bundle runtime DLLs
        shell: bash
        run: |
          mkdir -p dist
          find build/bin -maxdepth 1 -name "*.exe" -exec cp {} dist/ \;
          ls dist/
          # CUDA 13.2 runtime DLLs so the exes run without a full toolkit install
          CUDA_BIN="$(cygpath -u "$CUDA_PATH")/bin"
          echo "CUDA_BIN=$CUDA_BIN"
          cp "$CUDA_BIN"/cudart64_*.dll dist/ 2>/dev/null || true
          cp "$CUDA_BIN"/cublas64_*.dll dist/ 2>/dev/null || true
          cp "$CUDA_BIN"/cublasLt64_*.dll dist/ 2>/dev/null || true
          # MSVC runtime
          cp /c/Windows/System32/vcruntime140.dll dist/ 2>/dev/null || true
          cp /c/Windows/System32/vcruntime140_1.dll dist/ 2>/dev/null || true
          cp /c/Windows/System32/msvcp140.dll dist/ 2>/dev/null || true
          # sanity: the KVMem server must exist
          test -f dist/llama-kvmem-server.exe
          echo "=== final dist ==="
          ls -lah dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kvmem-sm86-win
          path: dist/
          if-no-files-found: error