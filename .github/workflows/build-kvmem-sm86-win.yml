# Build kvmem-llama.cpp (KVMem + llama.cpp) for sm_86 (RTX 30 series) on Windows
# KVMem requires exactly CUDA 13.2 Update 2 (nvcc 13.2.86) for IQ3/IQ4 correctness
# (nvcc 13.2.51 is known to produce garbage output on Qwen3.8-27B IQ3_S).
# Produces a self-contained package: thin launcher exes (llama-kvmem-server/
# llama-kvmem-cli/llama-quantize) + all shared libraries (ggml*.dll, llama*.dll,
# mtmd.dll, kvmem.dll) + CUDA 13.2 runtime DLLs, uploaded as a downloadable
# artifact. Smoke-tests the DLL dependency chain before upload.
name: build-kvmem-sm86-win

on:
  workflow_dispatch:

jobs:
  build-windows-sm86:
    runs-on: windows-2022
    steps:
      - name: Checkout (with llama.cpp submodule pin)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup CUDA 13.2 Update 2 (nvcc 13.2.86)
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '13.2.2'
          method: 'network'

      - name: Verify nvcc exact version (13.2.86 required)
        shell: bash
        run: |
          nvcc --version
          nvcc --version | grep -q "V13.2.86" || { echo "nvcc is not 13.2.86; KVMem correctness requires exactly this compiler"; exit 1; }

      - name: Setup MSVC environment (Ninja)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Replay KVMem patches on pinned llama.cpp
        shell: bash
        run: |
          bash scripts/apply-patches.sh
          echo "--- llama.cpp patch status ---"
          git -C llama.cpp status --short || true

      - name: Configure (sm_86, Release, FA all quants, shared libs)
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DGGML_CUDA=ON \
            -DGGML_CUDA_FA_ALL_QUANTS=ON \
            -DCMAKE_CUDA_ARCHITECTURES=86 \
            -DKVMEM_BUILD_LLAMA=ON \
            -DLLAMA_KVMEM=ON \
            -DLLAMA_KVMEM_ROOT="$GITHUB_WORKSPACE"

      # Build ONLY the deliverable targets. The kvmem test targets
      # (tests/nvme_kv_tier_test.cpp etc.) include POSIX-only headers
      # (<unistd.h>, <sys/*.h>) and cannot compile under MSVC, which broke the
      # earlier "build everything" step. LLAMA_BUILD_EXAMPLES is forced OFF
      # upstream, so llama-cli / llama-bench targets do not exist.
      # Shared-library mode: llama.dll links kvmem.lib, but CMake/Ninja does
      # not order the cross-subdirectory SHARED import library before the
      # llama.dll link (LNK1181: cannot open input file 'kvmem\kvmem.lib').
      # Build the kvmem library first, then everything else.
      - name: Build binaries (kvmem lib first, then deliverables)
        shell: bash
        run: |
          cmake --build build --config Release -j 3 --target kvmem
          cmake --build build --config Release -j 3 \
            --target llama-kvmem-server llama-kvmem-cli llama-quantize

      # Shared-library mode: the exes are thin launchers; the code lives in
      # ggml*.dll / llama*.dll / llama-common.dll / mtmd.dll / kvmem.dll etc.
      # Everything under build/bin must ship, plus the CUDA 13.2 runtime DLLs
      # (cudart/cublas/cublasLt) and the MSVC runtime.
      - name: Stage artifacts + bundle runtime DLLs
        shell: bash
        run: |
          set -euo pipefail
          echo "=== build/bin contents ==="
          ls -lah build/bin/
          mkdir -p dist
          cp build/bin/* dist/
          # CUDA 13.2 runtime DLLs - fail fast if missing (previous runs
          # silently swallowed this and shipped a non-runnable package)
          CUDA_BIN="/c/Program Files/NVIDIA GPU Computing Toolkit/CUDA/v13.2/bin"
          echo "CUDA_BIN=$CUDA_BIN"
          ls "$CUDA_BIN" | grep -E "cudart64_|cublas64_|cublasLt64_" || {
            echo "CUDA runtime DLLs NOT FOUND under $CUDA_BIN"
            ls "$CUDA_BIN" | head -40
            exit 1
          }
          cp "$CUDA_BIN"/cudart64_*.dll "$CUDA_BIN"/cublas64_*.dll "$CUDA_BIN"/cublasLt64_*.dll dist/
          # MSVC runtime
          cp /c/Windows/System32/vcruntime140.dll /c/Windows/System32/vcruntime140_1.dll /c/Windows/System32/msvcp140.dll dist/ 2>/dev/null || true
          # MSVC OpenMP runtime (harmless if the build does not link it)
          cp /c/Windows/System32/vcomp140.dll dist/ 2>/dev/null || true
          echo "=== smoke test: DLL dependency chain ==="
          ./dist/llama-kvmem-cli.exe -h >/dev/null 2>&1 || {
            echo "llama-kvmem-cli.exe failed to load (missing DLL?)"
            ./dist/llama-kvmem-cli.exe -h 2>&1 | head -10
            exit 1
          }
          echo "cli smoke OK"
          ./dist/llama-kvmem-server.exe -h >/dev/null 2>&1 || {
            echo "llama-kvmem-server.exe failed to load (missing DLL?)"
            ./dist/llama-kvmem-server.exe -h 2>&1 | head -10
            exit 1
          }
          echo "server smoke OK"
          echo "=== final dist ==="
          ls -lah dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kvmem-sm86-win
          path: dist/
          if-no-files-found: error